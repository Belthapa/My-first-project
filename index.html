<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Web Design</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      color: #1f2937;
      background: #f8fafc;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    nav a {
      margin-left: 25px;
      color: #374151;
      text-decoration: none;
    }

    nav a:hover {
      color: #2563eb;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      padding: 60px 8%;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
    }

    .hero-text {
      max-width: 550px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    h1 span {
      color: #2563eb;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      color: white;
      background: #2563eb;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .hero-card {
      padding: 80px 60px;
      border-radius: 20px;
      color: white;
      background: #2563eb;
      box-shadow: 0 15px 30px #93c5fd;
    }

    .hero-card h2 {
      font-size: 32px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #6b7280;
      background: white;
    }

    @media (max-width: 700px) {
      nav {
        display: none;
      }

      .hero {
        flex-direction: column;
        text-align: center;
      }

      h1 {
        font-size: 38px;
      }

      .hero-card {
        padding: 50px 35px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">BEL THAPA</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <section class="hero-text">
      <h1>Build Your <span>Digital Future</span></h1>
      <p>
        Create beautiful, modern, and responsive websites that help your
        business grow online.
      </p>
      <a class="button" href="#">Get Started</a>
    </section>

    <section class="hero-card">
      <h2>Creative</h2>
      <p>Simple. Modern. Powerful.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 WebStudio. All rights reserved.</p>
  </footer>
</body>
</html>
